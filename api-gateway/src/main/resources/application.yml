server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/orders/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/inventory/**
        # Documentacion OpenAPI de cada servicio, expuesta solo a traves del Gateway
        - id: order-service-docs
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/docs/orders/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: inventory-service-docs
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/docs/inventory/api-docs
          filters:
            - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Order Service
        url: /docs/orders/api-docs
      - name: Inventory Service
        url: /docs/inventory/api-docs

app:
  security:
    # Debe coincidir con el "iss" del token (URL con la que el cliente llama a Keycloak)
    issuer: ${APP_SECURITY_ISSUER:http://localhost:8180/realms/reto}
    # URL desde la cual el servicio descarga las llaves publicas
    jwk-set-uri: ${APP_SECURITY_JWK_SET_URI:http://localhost:8180/realms/reto/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never